dialogs:
  clone_title:
    en: "Clone “%{name}”"
    ru: "Клонировать «%{name}»"
  clone_description:
    en: "A new subproject in “%{folder}” starts from a copy of the “%{name}” conversation: Claude remembers everything said so far. From then on they go separately; “%{name}” stays as it is."
    ru: "Новый подпроект в «%{folder}» начнёт с копии переписки «%{name}»: Claude помнит всё, что было до сих пор. Дальше они идут отдельно, «%{name}» не меняется."
  clone_busy:
    en: "Claude is answering right now: the copy gets the conversation up to this moment, the answer in progress stays only in the original."
    ru: "Claude сейчас отвечает: в копию попадёт переписка до этого момента, ответ, который идёт, останется только в исходном."
  clone_ok:
    en: "Clone"
    ru: "Клонировать"
  about_example_first:
    en: "What it does: orders and stock in reports"
    ru: "Чем занимается: заявки товара и остатки в отчётах"
  about_example_second:
    en: "What it does: cash flow and supplier payments"
    ru: "Чем занимается: ДДС и платежи поставщикам"
  about_example_new:
    en: "What it does: stock export to the accounting system"
    ru: "Чем занимается: выгрузка остатков в 1С"
  about_description:
    en: "One line. The parallel sessions of the project read it: it tells them what you are working on here, so they can warn you about overlaps."
    ru: "Одна строка. Её видят параллельные сессии проекта: по ней они понимают, над чем вы работаете здесь, и предупреждают вас о пересечениях."
  what_it_does:
    en: "What it does"
    ru: "Чем занимается"
  save:
    en: "Save"
    ru: "Сохранить"
  split_name_into_subprojects:
    en: "Split “%{name}” into subprojects"
    ru: "Разделить «%{name}» на подпроекты"
  each_subproject_has_its_own:
    en: "Each subproject has its own Claude conversation; the folder stays shared. The current conversation is kept — it becomes the first subproject. The parallel sessions read the “What it does” line to understand what the others work on; you can skip it."
    ru: "У каждого подпроекта своя переписка Claude, папка остаётся общей. Текущая переписка не пропадёт — она станет первым подпроектом. Строку «Чем занимается» видят параллельные сессии — по ней они понимают, над чем работают соседи; можно пропустить."
  current_conversation:
    en: "Current conversation"
    ru: "Текущая переписка"
  new_subproject_field:
